<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Highway</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: "Courier New", Courier, monospace;
            touch-action: none; /* Prevent default touch actions like pull-to-refresh */
        }
        canvas {
            display: block;
        }

        /* CRT Filter */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #controls {
            padding: 10px;
            text-align: center;
            opacity: 0.5;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
        }

        a { color: #00ffff; text-decoration: none; pointer-events: auto;}
        a:hover { color: #ff00ff; }

        #pause-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #fff;
            color: #fff;
            cursor: pointer;
            pointer-events: auto;
            font-family: inherit;
        }
    </style>
</head>
<body class="crt">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div style="height: 50px;"></div> <!-- Spacer for score/text drawn on canvas -->
        <button id="pause-btn">||</button>
        <div id="controls">
            Controls: A/D or Arrows to Steer. SPACE to Jump. Mouse/Touch Drag to Steer, Swipe Up to Jump.<br>
            Created by <a href="http://www.waliulawaltaha.com" target="_blank" rel="noopener noreferrer">Waliul Awal Taha</a>
        </div>
    </div>

    <script type="module">
        import { initGame } from './src/game.js';

        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('gameCanvas');
            initGame(canvas);

            // Wire pause button (using global keys trick since we handle it in game.js via Escape)
            document.getElementById('pause-btn').addEventListener('click', () => {
                const e = new KeyboardEvent('keyup', {code: 'Escape'});
                window.dispatchEvent(e);
            });
        });
    </script>
</body>
</html>
